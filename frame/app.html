<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art frame</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2e9">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --paper: #f6f2e9;
    --card: #fffdf7;
    --ink: #2b2620;
    --soft: #8a8175;
    --rule: #ded5c4;
    --ok: #7b9484;
    --warn: #c0a077;
    --bad: #a97b76;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 28px 20px calc(36px + env(safe-area-inset-bottom));
    max-width: 680px;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  header { text-align: center; border-bottom: 1px solid var(--rule); padding-bottom: 18px; margin-bottom: 26px; }
  header h1 { font-size: 13px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; margin: 0; }
  header p { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 6px 0 0; }
  figure { margin: 0 0 28px; }
  figure img {
    display: block; width: 100%; height: auto; border-radius: 2px;
    background: var(--rule); min-height: 120px;
    box-shadow: 0 1px 2px rgba(60,48,32,.14), 0 10px 26px rgba(60,48,32,.10);
  }
  figcaption { margin-top: 20px; text-align: center; }
  .artist { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  .bio { font-size: 12px; letter-spacing: .08em; color: var(--soft); text-transform: uppercase; margin-top: 3px; }
  .title { font-size: 25px; font-style: italic; line-height: 1.25; margin: 12px 0 2px; }
  .made { color: var(--soft); }
  .about { margin: 18px auto 0; max-width: 46ch; color: #4b443b; }
  .credit { margin-top: 12px; font-size: 13px; color: var(--soft); font-style: italic; }
  details { max-width: 46ch; margin: 16px auto 0; text-align: left; }
  details summary {
    list-style: none; cursor: pointer; text-align: center;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft);
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " +"; }
  details[open] summary::after { content: " –"; }
  details p { color: #4b443b; margin: 12px 0 0; }
  details .src { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .tags { margin-top: 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  section { border-top: 1px solid var(--rule); padding-top: 20px; margin-top: 8px; }
  h2 { font-size: 12px; font-weight: 400; letter-spacing: .2em; text-transform: uppercase; color: var(--soft); margin: 0 0 14px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; margin: 0; font-size: 15px; }
  dt { color: var(--soft); }
  dd { margin: 0; text-align: right; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: middle; }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  ol { list-style: none; margin: 0; padding: 0; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 44vh; overflow: auto; }
  ol li { padding: 5px 0; border-top: 1px solid var(--rule); word-break: break-word; color: #574f45; }
  ol li:first-child { border-top: 0; }
  ol time { color: var(--soft); margin-right: 10px; }
  li.bad { color: var(--bad); }
  footer { margin-top: 28px; text-align: center; }
  .actions { margin: 0 0 28px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  #note { flex-basis: 100%; font-size: 13px; color: var(--soft); font-style: italic; margin: 0; }
  button:disabled { opacity: .5; }
  #fav.on { color: var(--ink); border-color: var(--soft); }
  .favhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .favhead h2 { margin: 0; }
  .favhead button { padding: 8px 12px; }
  #favnote { font-size: 13px; color: var(--soft); font-style: italic; margin: 10px 0 0; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-top: 16px; }
  .gallery button {
    padding: 0; border: 0; background: none; text-align: left; letter-spacing: normal; text-transform: none;
    font: 13px/1.35 inherit; font-family: inherit; color: var(--ink); cursor: pointer;
  }
  .gallery img {
    display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 2px;
    background: var(--rule); box-shadow: 0 1px 2px rgba(60,48,32,.14);
  }
  .gallery button.on img { outline: 2px solid var(--ok); outline-offset: 2px; }
  .gallery span { display: block; margin-top: 6px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gallery small { display: block; color: var(--soft); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .empty { color: var(--soft); font-style: italic; font-size: 14px; margin: 14px 0 0; }
  dialog {
    width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 18px; border: 1px solid var(--rule);
    border-radius: 2px; background: var(--card); color: var(--ink); text-align: center;
  }
  dialog::backdrop { background: rgba(43,38,32,.45); }
  dialog img { display: block; width: 100%; height: auto; max-height: 60vh; object-fit: contain; background: var(--rule); }
  dialog .title { font-size: 21px; }
  dialog .actions { margin: 16px 0 0; }
  button {
    font: 12px/1 inherit; font-family: inherit; letter-spacing: .16em; text-transform: uppercase;
    color: var(--soft); background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 10px 18px;
  }
</style>
</head>
<body>

<header>
  <h1>Art frame</h1>
  <p id="today">Today</p>
</header>

<figure>
  <img id="art" alt="Today's painting" src="/original.jpg" onerror="this.src='/today.png'">
  <figcaption>
    <div class="artist" id="artist">…</div>
    <div class="bio" id="bio"></div>
    <div class="title" id="title"></div>
    <div class="made" id="made"></div>
    <p class="about" id="about"></p>
    <div class="credit" id="credit"></div>
    <details id="more" hidden>
      <summary>More</summary>
      <p id="moretext"></p>
      <p class="src">From <span id="moreorigin">Wikipedia</span>, <a id="moresrc" href="#"></a></p>
    </details>
    <div class="tags" id="tags"></div>
  </figcaption>
</figure>

<div class="actions">
  <p id="note" hidden></p>
  <button onclick="send('/random')">Another painting</button>
  <button onclick="$('file').click()">Upload</button>
  <button id="fav" onclick="toggleFavorite()">Favorite</button>
  <input id="file" type="file" accept="image/*" hidden
    onchange="this.files[0] && send('/upload', this.files[0]); this.value = ''">
</div>

<section>
  <div class="favhead">
    <h2>Favorites</h2>
    <button id="favup" onclick="$('favfile').click()">Add a picture</button>
    <input id="favfile" type="file" accept="image/*" hidden
      onchange="this.files[0] && uploadFavorite(this.files[0]); this.value = ''">
  </div>
  <p id="favnote" hidden></p>
  <div class="gallery" id="gallery"></div>
  <p class="empty" id="favempty" hidden>Nothing kept yet. Favorite what is on the frame, or add a picture of your own.</p>
</section>

<dialog id="pick">
  <img id="pickimg" alt="">
  <div class="title" id="picktitle"></div>
  <div class="made" id="pickmade"></div>
  <div class="actions">
    <button onclick="showFavorite()">Put on the frame</button>
    <button onclick="removeFavorite()">Remove</button>
    <button onclick="$('pick').close()">Close</button>
  </div>
</dialog>

<section>
  <h2>On the frame</h2>
  <dl>
    <dt>Picked</dt><dd id="picked">–</dd>
    <dt>Last fetch by the board</dt><dd id="fetch">–</dd>
    <dt id="batlabel" hidden>Battery</dt><dd id="bat" hidden></dd>
    <dt>Last check by the board</dt><dd id="check">–</dd>
    <dt>Next check</dt><dd id="wake">–</dd>
    <dt>Collection</dt><dd><a id="met" href="https://www.metmuseum.org">The Met</a></dd>
  </dl>
</section>

<section>
  <h2><span class="dot" id="dot"></span><span id="health">Checking</span></h2>
  <ol id="log"></ol>
</section>

<footer><button onclick="load()">Refresh</button></footer>

<script>
const $ = id => document.getElementById(id);

function ago(iso) {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " hours ago";
  return Math.round(s / 86400) + " days ago";
}

function about(s) {
  // a wall label, from whatever the museum knows about this one
  const where = [s.culture, s.department].filter(x => x && x !== "Unknown").join(", ");
  return [s.medium, s.dimensions, where].filter(Boolean).join(". ").replace(/\.?$/, ".");
}

async function load() {
  let s;
  try {
    s = await (await fetch("/status", { cache: "no-store" })).json();
  } catch (e) {
    $("dot").className = "dot bad";
    $("health").textContent = "Server unreachable";
    return;
  }
  $("today").textContent = new Date().toLocaleDateString(undefined,
    { weekday: "long", day: "numeric", month: "long" });
  $("artist").textContent = s.artistDisplayName || "Unknown artist";
  $("bio").textContent = s.artistDisplayBio || "";
  $("title").textContent = s.title || "No painting yet";
  $("made").textContent = s.objectDate || "";
  $("about").textContent = about(s);
  $("credit").textContent = s.creditLine || "";
  $("more").hidden = !s.about;
  if (s.about) {
    $("moretext").textContent = s.about.text;
    $("moresrc").textContent = s.about.title;
    $("moresrc").href = s.about.url;
    $("moreorigin").textContent = s.about.source || "Wikipedia";
  }
  $("tags").textContent = (s.tags || []).join(" · ");
  $("picked").textContent = ago(s.picked);
  // a painting picked overnight or with KEY2 changes the text, so swap the picture with it
  if (s.picked && s.picked !== shown) {
    if (shown) $("art").src = "/original.jpg?" + Date.now();
    shown = s.picked;
  }
  $("fetch").textContent = ago(s.last_fetch);
  $("bat").hidden = $("batlabel").hidden = !s.battery;
  if (s.battery) $("bat").textContent = s.battery.percent + "% · " + s.battery.volts.toFixed(2) + " V";
  $("check").textContent = ago(s.last_check);
  const next = s.next_check && new Date(s.next_check);
  $("wake").textContent = !next ? "–" : next < Date.now() ? "overdue"
    : next.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  if (!busy) note(s.pending ? "Ready, the frame draws it at its next check." : "");
  if (s.objectURL) $("met").href = s.objectURL;
  if (s.collection) $("met").textContent = s.collection;
  favorite = s.favorite;
  $("fav").textContent = favorite ? "Favorited" : "Favorite";
  $("fav").classList.toggle("on", !!favorite);
  markShown();

  const bad = s.log.filter(l => l.bad).length;
  $("dot").className = "dot " + (bad ? "bad" : s.last_fetch ? "" : "warn");
  $("health").textContent = bad ? bad + " problem" + (bad > 1 ? "s" : "") + " in the log"
    : s.last_fetch ? "Syncing fine" : "Board has not asked yet";

  $("log").innerHTML = "";
  for (const l of s.log) {
    const li = document.createElement("li");
    if (l.bad) li.className = "bad";
    const t = document.createElement("time");
    t.textContent = l.time;
    li.append(t, l.msg);
    $("log").append(li);
  }
}

let busy = false;
let favorite;  // id of the favorite on the frame, if it is one
let kept = [];  // every favorite, newest first
let picked;  // the favorite open in the dialog
let shown;  // picked time of the painting on screen

function note(text) {
  $("note").hidden = !text;
  $("note").textContent = text;
}

async function send(path, file) {
  // picking a painting takes a minute or two, the server answers once it is ready
  busy = true;
  buttons(true);
  note(file ? "Converting your picture…" : "Picking a painting, this takes a minute or two…");
  try {
    const r = await fetch(path, { method: "POST", body: file,
      headers: file ? { "X-Filename": encodeURIComponent(file.name) } : {} });
    if (!r.ok) throw new Error((await r.text()).match(/<p>Message: (.*?)\.<\/p>/)?.[1] || r.statusText);
    busy = false;
    await load();
  } catch (e) {
    busy = false;
    note("That did not work: " + e.message);
  }
  buttons(false);
}

function buttons(off) {
  document.querySelectorAll(".actions button, #favup").forEach(b => b.disabled = off);
}

async function call(method, path, file) {
  const r = await fetch(path, { method, body: file,
    headers: file ? { "X-Filename": encodeURIComponent(file.name) } : {} });
  if (!r.ok) throw new Error((await r.text()).match(/<p>Message: (.*?)\.<\/p>/)?.[1] || r.statusText);
  return r.json();
}

async function toggleFavorite() {
  buttons(true);
  try {
    await call(favorite ? "DELETE" : "POST", favorite ? "/favorites/" + favorite : "/favorite");
    await load();
    await loadFavorites();
  } catch (e) {
    note("That did not work: " + e.message);
  }
  buttons(false);
}

async function loadFavorites() {
  try {
    kept = await (await fetch("/favorites", { cache: "no-store" })).json();
  } catch (e) {
    return;
  }
  $("gallery").innerHTML = "";
  $("favempty").hidden = kept.length > 0;
  for (const f of kept) {
    const b = document.createElement("button");
    b.dataset.id = f.id;
    const img = document.createElement("img");
    img.src = "/favorites/" + f.id + "/thumb.jpg";
    img.loading = "lazy";
    img.alt = "";
    const t = document.createElement("span");
    t.textContent = f.title || "Untitled";
    const by = document.createElement("small");
    by.textContent = f.artistDisplayName || f.collection || "";
    b.append(img, t, by);
    b.onclick = () => openFavorite(f);
    $("gallery").append(b);
  }
  markShown();
}

function markShown() {
  document.querySelectorAll(".gallery button").forEach(b => b.classList.toggle("on", b.dataset.id === favorite));
}

function favNote(text) {
  $("favnote").hidden = !text;
  $("favnote").textContent = text;
}

function openFavorite(f) {
  picked = f;
  $("pickimg").src = "/favorites/" + f.id + "/original.jpg";
  $("picktitle").textContent = f.title || "Untitled";
  $("pickmade").textContent = [f.artistDisplayName, f.objectDate].filter(Boolean).join(", ");
  $("pick").showModal();
}

async function showFavorite() {
  $("pick").close();
  buttons(true);
  try {
    await call("POST", "/favorites/" + picked.id + "/show");
    await load();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    favNote("That did not work: " + e.message);
  }
  buttons(false);
}

async function removeFavorite() {
  $("pick").close();
  try {
    await call("DELETE", "/favorites/" + picked.id);
    await load();
    await loadFavorites();
  } catch (e) {
    favNote("That did not work: " + e.message);
  }
}

async function uploadFavorite(file) {
  // the picture is converted for the panel now, so putting it on the frame later is instant
  $("favup").disabled = true;
  favNote("Converting your picture, this takes a minute…");
  try {
    await call("POST", "/favorites/upload", file);
    favNote("");
    await loadFavorites();
  } catch (e) {
    favNote("That did not work: " + e.message);
  }
  $("favup").disabled = false;
}

load();
loadFavorites();
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => !document.hidden && load());
</script>
</body>
</html>
